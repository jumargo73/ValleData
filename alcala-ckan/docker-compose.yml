networks:
  net-db:
    driver: bridge
    external: true
  net-nginx:
    driver: bridge
    external: true
  net-hijo-internal:
    driver: bridge
    external: true    
  net-fed-internal:
    driver: bridge 
    external: true

volumes:
  solr_root:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/storage/solr/alcala/var_solr

  storage_root:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/storage/ckan/alcala/storage

  site_packages_root:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/storage/ckan/alcala/site_packages    

  pip_cache_root:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/storage/ckan/alcala/pip_cache     

services:   
  solr:
    build:
      context: ../docker_solr/solr_image/
      dockerfile: Dockerfile  
    image: CKAN/ckan-solr:2.10-solr9
    command: solr-precreate ckan
    volumes:
      - solr_root:/var/solr
      - /mnt/storage/solr/schema/schema.xml:/var/solr/data/ckan/conf/managed-schema:ro
    networks:
      - net-db
      - net-hijo-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:8983/solr"]
      interval: 10s
      timeout: 5s
      retries: 5 

  redis:
    build:
      context: ../docker_redis/redis-image/
      dockerfile: Dockerfile 
    image: CKAN/redis:7
    networks:
      - net-hijo-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "QUIT"] 
      
  datapusher:
    networks:
      - net-db
      - net-hijo-internal       
    build:
      context: ../docker_datapusher/datapusher_images/
      dockerfile: Dockerfile   
    image: ckan/ckan-base-datapusher:0.0.21    
    volumes:
      - /mnt/storage/datapusher/deployment:/srv/app/src/datapusher/deployment:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/8800' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3        
      
  ckan:
    image: CKAN/ckan:2.11.4  
    depends_on:      
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy   
      datapusher:
        condition: service_healthy
    environment:
      # 1. Fuerza a uWSGI/Python a leer este archivo
      - CKAN_INI=/srv/app/ckan.ini
      # 2. Refuerza el dominio exterior directo en el entorno
      - CKAN_SITE_URL=http://alcala.gobernaciondelvalle.gov.co    
    ports:
      - "5000:5000"
    volumes:
      - storage_root:/var/lib/ckan
      - pip_cache_root:/root/.cache/pip
      - site_packages_root:/usr/lib/python3.10/site-packages
      - /mnt/storage/ckan/deployment:/srv/app/src/deployment
      - /mnt/storage/ckan/alcala/config/ckan.ini:/srv/app/ckan.ini:ro     
    restart: unless-stopped  
    networks:
      - net-nginx 
      - net-db
      - net-hijo-internal
      - net-fed-internal     
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://ckan:5000/api/3/action/status_show"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s       
  
  worker:
    networks:
      - net-fed-internal
      - net-db
      - net-hijo-internal
    image: CKAN/ckan:2.11.4        
    command: ckan -c /srv/app/ckan.ini jobs worker
    volumes:
      - /usr/lib/ckan/default/src/ValleData/alcala-ckan/config/ckan.ini:/srv/app/ckan.ini 
    depends_on:
      ckan:
        condition: service_healthy
      redis:
        condition: service_healthy      
    restart: unless-stopped  
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://alcala-ckan-ckan-1:5000/api/3/action/status_show"]
      interval: 60s
      timeout: 10s
      retries: 3  