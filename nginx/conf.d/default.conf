server_names_hash_bucket_size 128;

server {

    listen 80;  # 👈 Agregado para que Nginx escuche en el puerto 80    
    listen  [::]:80;
	client_max_body_size 100M;
	server_name alcala.gobernaciondelvalle.gov.co;   # ✅ Sin "http://", solo la IP
    
	location / {
        proxy_pass http://172.26.159.35:5000; 

        # 1. Cabeceras de Host básicas (Cruciales para redirección en CKAN)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 2. Cabeceras de Proxy e IP distribuidas
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port; # Usa dinámicamente el puerto del servidor

        # 3. Protocolo de Redirección (SE QUITA LA DUPLICADA)
        proxy_set_header X-Forwarded-Proto $scheme; 

        # 4. Parámetros opcionales para evitar que uWSGI cambie la URL internamente
        proxy_redirect off;
        proxy_buffering off;
    }
}

