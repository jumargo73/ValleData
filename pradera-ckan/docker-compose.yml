networks:
  net-db:
    driver: bridge
    external: true
  net-nginx:
    driver: bridge
    external: true
  net-hijo-internal:
    driver: bridge
    external: true    
  net-fed-internal:
    driver: bridge 
    external: true

volumes:
  solr_root:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/storage/solr/pradera/var_solr    

  storage_root:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/storage/ckan/pradera/storage

  site_packages_root:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/storage/ckan/pradera/site_packages    

  pip_cache_root:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/storage/ckan/pradera/pip_cache      

services:   
  solr:
    image: CKAN/ckan-solr:2.10-solr9
    command: solr-precreate ckan
    restart: always
    volumes:
      - solr_root:/var/solr
      - /mnt/storage/solr/schema/schema.xml:/var/solr/data/ckan/conf/managed-schema:ro
    networks:
      - net-db
      - net-hijo-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:8983/solr"]
      interval: 10s
      timeout: 5s
      retries: 5 

  redis:
    image: CKAN/redis:7
    networks:
      - net-hijo-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "QUIT"] 
      
  datapusher:
    networks:
      - net-db
      - net-hijo-internal       
    image: ckan/ckan-base-datapusher:0.0.21   
    # Dentro de tu docker-compose.yml en el servicio datapusher:
    volumes:
      - /mnt/storage/datapusher/deployment:/srv/app/src/datapusher/deployment:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/8800' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3        
      
  ckan:
    image: CKAN/ckan:2.11.4
    depends_on:      
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy   
      datapusher:
        condition: service_healthy  
    ports:
      - "5001:5000"
    environment:
      - CKAN_INI=/srv/app/ckan.ini  
      - CKAN_SITE_URL=http://pradera.gobernaciondelvalle.gov.co  
      - DATAPUSHER_CKAN_API_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJrRVFFekttaldfWFNTOWFDcm5BUDJVeW9sc1FVWmlVYVVRbndyY252U0g0IiwiaWF0IjoxNzc5NTM5MjY2fQ.nguhpsHrYxaGZisCMP72nNQSrBNL6CVzLVLkAS-vRzk
    volumes:
      - storage_root:/var/lib/ckan
      - pip_cache_root:/root/.cache/pip
      - site_packages_root:/usr/lib/python3.10/site-packages
      - /mnt/storage/ckan/deployment:/srv/app/src/deployment
      - /mnt/storage/ckan/pradera/config/ckan.ini:/srv/app/ckan.ini
    restart: unless-stopped  
    networks:
      - net-nginx 
      - net-db
      - net-hijo-internal
      - net-fed-internal     
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://ckan:5000/api/3/action/status_show"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s       
  
  worker:
    networks:
      - net-fed-internal
      - net-db
      - net-hijo-internal
    image: CKAN/ckan:2.11.4        
    command: ckan -c /srv/app/ckan.ini jobs worker
    volumes:
      - /usr/lib/ckan/default/src/ValleData/pradera-ckan/config/ckan.ini:/srv/app/ckan.ini 
    depends_on:
      ckan:
        condition: service_healthy
      redis:
        condition: service_healthy      
    restart: unless-stopped  
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://pradera-ckan-ckan-1:5000/api/3/action/status_show"]
      interval: 60s
      timeout: 10s
      retries: 3  