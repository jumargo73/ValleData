[uwsgi]
# --- OPTIMIZACIÓN DE RENDIMIENTO ---
# Aumenta el tiempo de espera. 50s es muy poco para procesos pesados.
harakiri        = 120       # Sube a 5 minutos (300s)
http-timeout    = 300
socket-timeout  = 300

# --- PARALELISMO (FUNDAMENTAL) ---
# Tu config actual no define procesos, por defecto usa solo 1.
processes       = 3         # Un worker por cada núcleo (ajusta según tu CPU)
threads         = 2         # Maneja hilos para tareas de E/S
enable-threads  = true
master          = true

# --- GESTIÓN DE MEMORIA Y BUFFERS ---
buffer-size     = 65536
post-buffering  = 8192      # Ayuda con cargas de archivos grandes
max-requests    = 1000      # Reinicia workers cada 1000 peticiones para limpiar RAM
max-worker-lifetime = 3600  # Reinicia cada hora para evitar fugas de memoria

# --- CONFIGURACIÓN DE RED ---
http            = 127.0.0.1:5050
listen          = 256       # Aumenta la cola de espera de conexiones
lazy-apps       = true      # Carga la app en cada worker (evita errores de Prisma/DB)

# --- RUTAS Y PERMISOS (MANTENER) ---
uid             = www-data
gid             = www-data
wsgi-file       = /usr/lib/ckan/default/src/valle_data/alcala-ckan/ckan/wsgi.py
virtualenv      = /usr/lib/ckan/default
module          = wsgi:application
pidfile         = /tmp/%n.pid
vacuum          = true
callable        = application
strict          = true
